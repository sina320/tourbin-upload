<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourBin · Secure Upload</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- SheetJS for Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== TOURBIN BRAND SYSTEM ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
        }

        :root {
            --tb-primary: #1E3B4A;
            --tb-primary-dark: #0F2A36;
            --tb-primary-light: #EAF3F5;
            --tb-accent: #E67E22;
            --tb-success: #0F7B6B;
            --tb-success-light: #E3F2EF;
            --tb-gray-50: #F9FBFC;
            --tb-gray-100: #F1F5F9;
            --tb-gray-200: #E2E8F0;
            --tb-gray-300: #CBD5E1;
            --tb-gray-400: #94A3B8;
            --tb-gray-500: #64748B;
            --tb-gray-600: #475569;
            --tb-gray-700: #334155;
            --tb-gray-800: #1E293B;
            --tb-gray-900: #0F172A;
            --tb-red: #DC2626;
            --tb-red-light: #FEF2F2;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }

        .logo-fallback {
            font-size: 24px;
            font-weight: 700;
            color: var(--tb-primary);
            letter-spacing: -0.5px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 14px;
            background: white;
            padding: 8px 22px 8px 16px;
            border-radius: 60px;
            border: 1px solid var(--tb-gray-200);
            cursor: pointer;
            transition: all 0.15s;
        }

        .user-badge:hover {
            border-color: var(--tb-primary);
            background: var(--tb-gray-50);
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            background: var(--tb-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 15px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--tb-gray-800);
        }

        .user-role {
            font-size: 11px;
            color: var(--tb-gray-500);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 32px;
            width: 460px;
            max-width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--tb-gray-900);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-title i {
            color: var(--tb-primary);
        }

        .modal-sub {
            color: var(--tb-gray-500);
            font-size: 14px;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--tb-gray-200);
            padding-bottom: 24px;
        }

        .email-input {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid var(--tb-gray-300);
            border-radius: 18px;
            font-size: 15px;
            margin-bottom: 16px;
            transition: all 0.15s;
        }

        .email-input:focus {
            outline: none;
            border-color: var(--tb-primary);
            box-shadow: 0 0 0 3px rgba(30, 59, 74, 0.05);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: var(--tb-primary);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .login-btn:hover {
            background: var(--tb-primary-dark);
        }

        .login-btn:disabled {
            background: var(--tb-gray-300);
            cursor: not-allowed;
        }

        .magic-link-btn {
            width: 100%;
            padding: 16px;
            background: white;
            border: 1px solid var(--tb-gray-300);
            border-radius: 60px;
            font-size: 15px;
            font-weight: 600;
            color: var(--tb-gray-800);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .magic-link-btn:hover {
            background: var(--tb-gray-50);
            border-color: var(--tb-primary);
        }

        .magic-link-btn i {
            color: var(--tb-primary);
        }

        .logout-btn {
            width: 100%;
            padding: 14px;
            background: var(--tb-red-light);
            border: none;
            border-radius: 60px;
            color: var(--tb-red);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .access-badge {
            display: inline-block;
            padding: 6px 14px;
            background: var(--tb-primary-light);
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            color: var(--tb-primary);
            margin-left: 12px;
        }

        .status-message {
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-success {
            background: var(--tb-success-light);
            color: var(--tb-success);
            border-left: 4px solid var(--tb-success);
        }

        .status-error {
            background: var(--tb-red-light);
            color: var(--tb-red);
            border-left: 4px solid var(--tb-red);
        }

        .status-info {
            background: #EFF6FF;
            color: #1E40AF;
            border-left: 4px solid #3B82F6;
        }

        .upload-card {
            background: white;
            border-radius: 32px;
            padding: 40px;
            border: 1px solid var(--tb-gray-200);
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--tb-gray-900);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i {
            color: var(--tb-primary);
        }

        .upload-area {
            border: 2px dashed var(--tb-gray-300);
            background: var(--tb-gray-50);
            border-radius: 24px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 28px;
        }

        .upload-area:hover {
            border-color: var(--tb-primary);
            background: var(--tb-primary-light);
        }

        .upload-area.dragover {
            border-color: var(--tb-primary);
            background: var(--tb-primary-light);
        }

        .upload-icon {
            font-size: 52px;
            color: var(--tb-gray-400);
            margin-bottom: 16px;
        }

        .upload-text {
            font-size: 17px;
            font-weight: 600;
            color: var(--tb-gray-800);
            margin-bottom: 8px;
        }

        .file-name {
            margin-top: 20px;
            padding: 14px;
            background: var(--tb-primary-light);
            border-radius: 16px;
            font-size: 14px;
            color: var(--tb-primary);
            font-weight: 500;
            display: none;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 28px;
        }

        .field {
            flex: 1;
        }

        .field-label {
            font-size: 12px;
            color: var(--tb-gray-600);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        .date-input, .tag-select {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--tb-gray-300);
            border-radius: 18px;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            padding: 18px;
            background: var(--tb-primary);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn:hover {
            background: var(--tb-primary-dark);
        }

        .btn:disabled {
            background: var(--tb-gray-300);
            cursor: not-allowed;
        }

        .success-message {
            background: var(--tb-success-light);
            border: 1px solid var(--tb-success);
            border-radius: 24px;
            padding: 28px;
            margin-top: 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            animation: slideUp 0.3s ease;
        }

        .success-icon {
            width: 64px;
            height: 64px;
            background: var(--tb-success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
        }

        .success-stats {
            display: flex;
            gap: 28px;
            margin-top: 16px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--tb-gray-900);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden {
            display: none !important;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: var(--tb-gray-500);
            padding-top: 24px;
            border-top: 1px solid var(--tb-gray-200);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <img src="https://irp.cdn-website.com/4c7fac7a/dms3rep/multi/tourbin.png" 
                     alt="TourBin" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="logo-fallback" style="display: none;">TourBin</span>
            </div>
            <div class="user-badge" id="userBadge" onclick="showAuthModal()">
                <div class="user-avatar" id="userAvatar">TB</div>
                <div class="user-info">
                    <span class="user-name" id="userName">Sign in</span>
                    <span class="user-role" id="userRole">with email</span>
                </div>
                <i class="fas fa-chevron-down" style="font-size: 12px; color: var(--tb-gray-400);"></i>
            </div>
        </div>

        <!-- Auth Modal -->
        <div id="authModal" class="modal">
            <div class="modal-content">
                <div class="modal-title">
                    <i class="fas fa-shield-alt"></i> TourBin Access
                </div>
                <div class="modal-sub">
                    Sign in with your email · Admin approval required
                </div>

                <div id="authStatus" class="hidden"></div>

                <input type="email" id="emailInput" class="email-input" placeholder="your.email@company.com" value="sinamehrabi@gmail.com">
                
                <button class="login-btn" id="emailLoginBtn" onclick="sendMagicLink()">
                    <i class="fas fa-envelope"></i> Send magic link
                </button>

                <div style="display: flex; align-items: center; gap: 16px; margin: 20px 0;">
                    <div style="flex: 1; height: 1px; background: var(--tb-gray-200);"></div>
                    <span style="color: var(--tb-gray-500); font-size: 13px;">OR</span>
                    <div style="flex: 1; height: 1px; background: var(--tb-gray-200);"></div>
                </div>

                <button class="magic-link-btn" onclick="testAdminAccess()">
                    <i class="fas fa-key"></i> Test admin access (sinamehrabi@gmail.com)
                </button>

                <button class="logout-btn" id="logoutBtn" onclick="logout()" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> Sign out
                </button>
            </div>
        </div>

        <!-- Upload Card -->
        <div class="upload-card">
            <div class="section-title">
                <i class="fas fa-cloud-upload-alt"></i> Upload sales report
            </div>

            <div class="upload-area" id="uploadBox">
                <div class="upload-icon">
                    <i class="fas fa-file-excel"></i>
                </div>
                <div class="upload-text">Choose Excel file or drag it here</div>
                <div class="upload-hint">.xlsx only · Monthly/Daily sales report</div>
                <div class="file-name" id="fileName"></div>
            </div>
            <input type="file" id="fileInput" accept=".xlsx" style="display: none;">

            <div class="row">
                <div class="field">
                    <div class="field-label"><i class="far fa-calendar-alt"></i> Report date</div>
                    <input type="date" class="date-input" id="reportDate">
                </div>
                <div class="field">
                    <div class="field-label"><i class="fas fa-tag"></i> Type</div>
                    <select class="tag-select" id="reportTag">
                        <option value="daily">Daily sales</option>
                        <option value="monthly">Monthly sales</option>
                        <option value="correction">Correction</option>
                    </select>
                </div>
            </div>

            <button class="btn" id="uploadBtn" disabled>
                <i class="fas fa-lock"></i> Sign in to upload
            </button>

            <div id="successMessage" class="success-message hidden">
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <div>
                    <div style="font-size: 20px; font-weight: 700; color: var(--tb-success); margin-bottom: 6px;" id="successTitle"></div>
                    <div style="color: var(--tb-gray-600); font-size: 14px; margin-bottom: 16px;" id="successDesc"></div>
                    <div class="success-stats" id="successStats"></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <i class="fas fa-shield-alt"></i> TourBin · Secure Access · Admin Approval Required
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyDGomc7oZCGf8QkQq3I_SJht7GJF6pz_5c",
            authDomain: "tourbin-sales-dashboard-v2.firebaseapp.com",
            projectId: "tourbin-sales-dashboard-v2",
            storageBucket: "tourbin-sales-dashboard-v2.firebasestorage.app",
            messagingSenderId: "827092290582",
            appId: "1:827092290582:web:24e530b12858c615d13937"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== ADMIN EMAIL =====
        const ADMIN_EMAIL = 'sinamehrabi@gmail.com';
        let currentUser = null;

        // ===== CHECK AUTH STATE =====
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Check if user has admin access
                const userDoc = await db.collection('users').doc(user.uid).get();
                const userData = userDoc.data();
                
                if (user.email === ADMIN_EMAIL || (userData && userData.role === 'admin')) {
                    // Admin access granted
                    currentUser = {
                        uid: user.uid,
                        email: user.email,
                        role: 'admin'
                    };
                    
                    // Save to Firestore
                    await db.collection('users').doc(user.uid).set({
                        email: user.email,
                        role: 'admin',
                        lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                        approvedBy: 'system',
                        approvedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    updateUIForAdmin(user);
                    showAuthStatus('success', '✅ Admin access granted. You can now upload files.');
                } else {
                    // Pending approval
                    currentUser = null;
                    showAuthStatus('info', '⏳ Your account is pending admin approval. Please wait.');
                    disableUpload();
                }
            } else {
                // Not logged in
                currentUser = null;
                document.getElementById('userName').innerHTML = 'Sign in';
                document.getElementById('userRole').innerHTML = 'with email';
                document.getElementById('userAvatar').innerHTML = 'TB';
                document.getElementById('uploadBtn').innerHTML = '<i class="fas fa-lock"></i> Sign in to upload';
                document.getElementById('uploadBtn').disabled = true;
                document.getElementById('logoutBtn').style.display = 'none';
            }
        });

        // ===== SEND MAGIC LINK =====
        window.sendMagicLink = async function() {
            const email = document.getElementById('emailInput').value;
            
            if (!email) {
                showAuthStatus('error', 'Please enter your email address');
                return;
            }

            const btn = document.getElementById('emailLoginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';

            try {
                // Send sign-in link
                await auth.sendSignInLinkToEmail(email, {
                    url: window.location.href,
                    handleCodeInApp: true
                });

                // Save email for later
                window.localStorage.setItem('emailForSignIn', email);

                showAuthStatus('success', `✅ Magic link sent to ${email}. Check your inbox.`);
                
                // Save to pending approvals
                await db.collection('pending_approvals').doc(email.replace(/\./g, '_')).set({
                    email: email,
                    requestedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'pending'
                });

            } catch (error) {
                console.error('Error sending magic link:', error);
                showAuthStatus('error', '❌ ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-envelope"></i> Send magic link';
            }
        };

        // ===== TEST ADMIN ACCESS (FOR SINAMEHRABI@GMAIL.COM) =====
        window.testAdminAccess = async function() {
            showAuthStatus('info', '🔑 Granting admin access to sinamehrabi@gmail.com...');

            try {
                // Create anonymous session for demo
                const userCred = await auth.signInAnonymously();
                const user = userCred.user;
                
                // Grant admin access
                await db.collection('users').doc(user.uid).set({
                    email: ADMIN_EMAIL,
                    role: 'admin',
                    approvedBy: 'system',
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    isTestAdmin: true
                });

                // Update user profile
                await user.updateEmail(ADMIN_EMAIL);
                
                showAuthStatus('success', '✅ Admin access granted! You can now upload files.');
                
            } catch (error) {
                console.error('Error granting admin access:', error);
                showAuthStatus('error', '❌ ' + error.message);
            }
        };

        // ===== UPDATE UI FOR ADMIN =====
        function updateUIForAdmin(user) {
            document.getElementById('userName').innerHTML = user.email.split('@')[0];
            document.getElementById('userRole').innerHTML = 'Administrator';
            document.getElementById('userAvatar').innerHTML = 'AD';
            document.getElementById('uploadBtn').innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload to Firestore';
            document.getElementById('uploadBtn').disabled = false;
            document.getElementById('logoutBtn').style.display = 'flex';
            
            // Close modal
            document.getElementById('authModal').style.display = 'none';
        }

        // ===== DISABLE UPLOAD =====
        function disableUpload() {
            document.getElementById('uploadBtn').innerHTML = '<i class="fas fa-lock"></i> Pending approval';
            document.getElementById('uploadBtn').disabled = true;
        }

        // ===== SHOW AUTH STATUS =====
        function showAuthStatus(type, message) {
            const statusEl = document.getElementById('authStatus');
            statusEl.className = 'status-message status-' + type;
            statusEl.innerHTML = message;
            statusEl.classList.remove('hidden');
            
            setTimeout(() => {
                statusEl.classList.add('hidden');
            }, 5000);
        }

        // ===== SHOW AUTH MODAL =====
        window.showAuthModal = function() {
            document.getElementById('authModal').style.display = 'flex';
        };

        window.hideAuthModal = function() {
            document.getElementById('authModal').style.display = 'none';
        };

        // ===== LOGOUT =====
        window.logout = function() {
            auth.signOut();
            currentUser = null;
            hideAuthModal();
        };

        // ===== SET DEFAULT DATE =====
        const today = new Date();
        document.getElementById('reportDate').value = today.toISOString().split('T')[0];

        // ===== DRAG & DROP =====
        const fileInput = document.getElementById('fileInput');
        const uploadBox = document.getElementById('uploadBox');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const successMsg = document.getElementById('successMessage');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadBox.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadBox.addEventListener(eventName, () => uploadBox.classList.add('dragover'));
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadBox.addEventListener(eventName, () => uploadBox.classList.remove('dragover'));
        });

        uploadBox.addEventListener('drop', function(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                fileInput.files = files;
                fileName.style.display = 'block';
                fileName.innerHTML = `<i class="fas fa-check-circle" style="color: var(--tb-success);"></i> ${files[0].name}`;
            }
        });

        uploadBox.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                fileName.style.display = 'block';
                fileName.innerHTML = `<i class="fas fa-check-circle" style="color: var(--tb-success);"></i> ${this.files[0].name}`;
            }
        });

        // ===== UPLOAD TO FIRESTORE =====
        uploadBtn.addEventListener('click', async function() {
            if (!currentUser || currentUser.role !== 'admin') {
                alert('Admin access required');
                return;
            }

            if (!fileInput.files.length) {
                alert('Please select a file');
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                const file = fileInput.files[0];
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data);
                const firstSheet = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheet];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                uploadBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Uploading ${jsonData.length} records...`;

                let newCount = 0, duplicateCount = 0, errorCount = 0;

                for (const row of jsonData) {
                    try {
                        const cartCode = row['Cart confirmation code'];
                        if (!cartCode) continue;

                        const existing = await db.collection('sales_transactions')
                            .where('cart_confirmation_code', '==', cartCode)
                            .get();

                        if (!existing.empty) {
                            duplicateCount++;
                            continue;
                        }

                        await db.collection('sales_transactions').add({
                            cart_confirmation_code: cartCode,
                            creation_date: row['Creation date'] ? new Date(row['Creation date']) : null,
                            status: row['Status'] || 'UNKNOWN',
                            total_price_usd: parseFloat(row['Total price with discount']) || 0,
                            commission_usd: parseFloat(row['Commission']) || 0,
                            agent_name: row['Booking Agent'] || row['Affiliate'] || '',
                            channel: row['Booking channel'] || 'Unknown',
                            report_date: document.getElementById('reportDate').value,
                            report_type: document.getElementById('reportTag').value,
                            file_name: file.name,
                            uploaded_at: firebase.firestore.FieldValue.serverTimestamp(),
                            uploaded_by: currentUser.email
                        });

                        newCount++;
                    } catch (error) {
                        errorCount++;
                    }
                }

                // Show success message
                document.getElementById('successTitle').innerHTML = '✅ Upload successful';
                document.getElementById('successDesc').innerHTML = `File: ${file.name}`;
                document.getElementById('successStats').innerHTML = `
                    <div><span style="color: var(--tb-gray-500);">Total</span><br><span class="stat-value">${jsonData.length}</span></div>
                    <div><span style="color: var(--tb-gray-500);">New</span><br><span class="stat-value">${newCount}</span></div>
                    <div><span style="color: var(--tb-gray-500);">Duplicate</span><br><span class="stat-value">${duplicateCount}</span></div>
                `;
                successMsg.classList.remove('hidden');

                setTimeout(() => successMsg.classList.add('hidden'), 10000);

            } catch (error) {
                alert('Upload failed: ' + error.message);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload to Firestore';
            }
        });

        // ===== CLOSE MODAL ON CLICK OUTSIDE =====
        window.onclick = function(event) {
            const modal = document.getElementById('authModal');
            if (event.target === modal) {
                hideAuthModal();
            }
        };

        // ===== AUTO SHOW MODAL IF NOT LOGGED IN =====
        setTimeout(() => {
            if (!auth.currentUser) {
                showAuthModal();
            }
        }, 1000);
    </script>
</body>
</html>
