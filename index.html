<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TourBin · Data Upload</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Font: Inter (TourBin Brand) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== TOURBIN BRAND SYSTEM - V1.0 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #F7F9FC;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== TOURBIN BRAND COLORS ===== */
        :root {
            /* Primary Brand Colors - TourBin */
            --tb-navy: #0A2A3B;        /* Deep navy blue - اصلی برند */
            --tb-teal: #1D7A6B;         /* Signature teal - سبز فیروزه‌ای توربین */
            --tb-teal-light: #E8F3F1;   /* Light teal - پس‌زمینه‌ها */
            --tb-sand: #F5F0E8;         /* Warm sand - سند توربین */
            --tb-stone: #E4E3DF;        /* Neutral stone - مرزی‌ها */
            --tb-charcoal: #2C3E4A;     /* Dark charcoal - متن ثانویه */
            --tb-white: #FFFFFF;
            --tb-success: #1D7A6B;      /* Success = teal */
            --tb-success-light: #E8F3F1;
            --tb-error: #B83B3B;
            --tb-error-light: #FBECEC;
            
            /* Spacing System */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
            
            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 999px;
            
            /* Shadows */
            --shadow-sm: 0 2px 8px rgba(10, 42, 59, 0.04);
            --shadow-md: 0 4px 16px rgba(10, 42, 59, 0.06);
            --shadow-lg: 0 8px 24px rgba(10, 42, 59, 0.08);
        }

        /* ===== TYPOGRAPHY ===== */
        h1, h2, h3, h4, p, span {
            font-family: 'Inter', sans-serif;
        }

        /* ===== HEADER با لوگوی TourBin ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-8);
        }

        .logo {
            display: flex;
            align-items: center;
            height: 40px;
        }

        .logo-image {
            height: 40px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        .logo-fallback {
            display: none;
            font-size: 24px;
            font-weight: 700;
            color: var(--tb-navy);
            letter-spacing: -0.02em;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            background: var(--tb-teal-light);
            border-radius: var(--radius-full);
            color: var(--tb-teal);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .brand-badge i {
            font-size: 14px;
            color: var(--tb-teal);
        }

        /* ===== UPLOAD CARD ===== */
        .upload-card {
            background: var(--tb-white);
            border-radius: var(--radius-xl);
            padding: var(--space-10);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--tb-stone);
            transition: box-shadow 0.2s ease;
        }

        .upload-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--tb-navy);
            margin-bottom: var(--space-6);
            display: flex;
            align-items: center;
            gap: var(--space-3);
            letter-spacing: -0.01em;
        }

        .section-title i {
            color: var(--tb-teal);
            font-size: 22px;
        }

        /* ===== UPLOAD AREA ===== */
        .upload-area {
            border: 2px dashed var(--tb-stone);
            background: #FAFBF9;
            border-radius: var(--radius-lg);
            padding: var(--space-12) var(--space-6);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: var(--space-6);
        }

        .upload-area:hover {
            border-color: var(--tb-teal);
            background: var(--tb-teal-light);
        }

        .upload-area.dragover {
            border-color: var(--tb-teal);
            background: var(--tb-teal-light);
            border-width: 2px;
        }

        .upload-icon {
            font-size: 48px;
            color: var(--tb-navy);
            opacity: 0.5;
            margin-bottom: var(--space-4);
        }

        .upload-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--tb-navy);
            margin-bottom: var(--space-1);
            letter-spacing: -0.01em;
        }

        .upload-hint {
            font-size: 13px;
            color: #5C6F7A;
            font-weight: 400;
        }

        .file-name {
            margin-top: var(--space-4);
            padding: var(--space-3) var(--space-4);
            background: var(--tb-teal-light);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--tb-teal);
            font-weight: 500;
            display: none;
            border-left: 3px solid var(--tb-teal);
            word-break: break-all;
        }

        .file-name i {
            margin-right: var(--space-2);
        }

        /* ===== FORM FIELDS ===== */
        .row {
            display: flex;
            gap: var(--space-4);
            margin-bottom: var(--space-6);
        }

        .field {
            flex: 1;
        }

        .field-label {
            font-size: 12px;
            color: #5C6F7A;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: var(--space-2);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-weight: 600;
        }

        .field-label i {
            color: var(--tb-teal);
            font-size: 13px;
        }

        .date-input, .tag-select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--tb-stone);
            border-radius: var(--radius-md);
            font-size: 15px;
            color: var(--tb-navy);
            background: var(--tb-white);
            transition: all 0.15s ease;
            font-family: 'Inter', sans-serif;
        }

        .date-input:focus, .tag-select:focus {
            outline: none;
            border-color: var(--tb-teal);
            box-shadow: 0 0 0 3px rgba(29, 122, 107, 0.08);
        }

        /* ===== BUTTON ===== */
        .btn {
            width: 100%;
            padding: 16px 24px;
            background: var(--tb-navy);
            color: var(--tb-white);
            border: none;
            border-radius: var(--radius-full);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-3);
            letter-spacing: -0.01em;
        }

        .btn:hover {
            background: #0E3445;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn:disabled {
            background: #E4E3DF;
            color: #8B9AA5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn i {
            font-size: 18px;
        }

        /* ===== SUCCESS MESSAGE ===== */
        .success-message {
            background: var(--tb-teal-light);
            border: 1px solid var(--tb-teal);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            margin-top: var(--space-6);
            display: none;
            align-items: center;
            gap: var(--space-5);
            animation: slideIn 0.3s ease;
        }

        .success-icon {
            width: 56px;
            height: 56px;
            background: var(--tb-teal);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--tb-white);
            font-size: 28px;
            flex-shrink: 0;
        }

        .success-content {
            flex: 1;
        }

        .success-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--tb-navy);
            margin-bottom: var(--space-1);
        }

        .success-desc {
            font-size: 14px;
            color: #5C6F7A;
            margin-bottom: var(--space-3);
        }

        .success-stats {
            display: flex;
            gap: var(--space-6);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            color: #6E848F;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-weight: 600;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--tb-navy);
            line-height: 1.2;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: var(--space-6);
            text-align: center;
            font-size: 12px;
            color: #8B9AA5;
            padding-top: var(--space-6);
            border-top: 1px solid var(--tb-stone);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--space-2);
        }

        .footer i {
            color: var(--tb-teal);
            font-size: 12px;
        }

        /* ===== UTILITIES ===== */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER با لوگوی TourBin ===== -->
        <div class="header">
            <div class="logo">
                <!-- TourBin Official Logo -->
                <img src="https://irp.cdn-website.com/4c7fac7a/dms3rep/multi/tourbin.png" 
                     alt="TourBin" 
                     class="logo-image"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="logo-fallback">TourBin</span>
            </div>
            <div class="brand-badge">
                <i class="fas fa-check-circle"></i>
                <span>Secure Upload</span>
            </div>
        </div>

        <!-- ===== UPLOAD CARD ===== -->
        <div class="upload-card">
            <div class="section-title">
                <i class="fas fa-cloud-upload-alt"></i>
                Upload sales report
            </div>

            <!-- Drag & Drop Area -->
            <div class="upload-area" id="uploadBox">
                <div class="upload-icon">
                    <i class="fas fa-file-excel"></i>
                </div>
                <div class="upload-text">
                    Choose file or drag here
                </div>
                <div class="upload-hint">
                    .xlsx format · Daily / Monthly report
                </div>
                <div class="file-name" id="fileName"></div>
            </div>
            <input type="file" id="fileInput" accept=".xlsx" style="display: none;">

            <!-- Date & Type -->
            <div class="row">
                <div class="field">
                    <div class="field-label">
                        <i class="far fa-calendar-alt"></i>
                        Report date
                    </div>
                    <input type="date" class="date-input" id="reportDate">
                </div>
                <div class="field">
                    <div class="field-label">
                        <i class="fas fa-tag"></i>
                        Type
                    </div>
                    <select class="tag-select" id="reportTag">
                        <option value="daily">Daily sales</option>
                        <option value="monthly">Monthly sales</option>
                        <option value="correction">Correction</option>
                    </select>
                </div>
            </div>

            <!-- Upload Button -->
            <button class="btn" id="uploadBtn">
                <i class="fas fa-cloud-upload-alt"></i>
                Upload to database
            </button>

            <!-- Success Message -->
            <div id="successMessage" class="success-message">
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <div class="success-content">
                    <div class="success-title" id="successTitle">
                        Upload completed
                    </div>
                    <div class="success-desc" id="successDesc">
                        File processed successfully
                    </div>
                    <div class="success-stats" id="successStats"></div>
                </div>
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <i class="fas fa-shield-alt"></i>
            TourBin · Data ingestion · v1.0
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyDGomc7oZCGf8QkQq3I_SJht7GJF6pz_5c",
            authDomain: "tourbin-sales-dashboard-v2.firebaseapp.com",
            projectId: "tourbin-sales-dashboard-v2",
            storageBucket: "tourbin-sales-dashboard-v2.firebasestorage.app",
            messagingSenderId: "827092290582",
            appId: "1:827092290582:web:24e530b12858c615d13937"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);

        // ===== SET DEFAULT DATE =====
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        document.getElementById('reportDate').value = `${y}-${m}-${d}`;

        // ===== DRAG & DROP SETUP =====
        const fileInput = document.getElementById('fileInput');
        const uploadBox = document.getElementById('uploadBox');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const successMsg = document.getElementById('successMessage');

        // Prevent defaults
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadBox.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadBox.addEventListener(eventName, () => uploadBox.classList.add('dragover'));
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadBox.addEventListener(eventName, () => uploadBox.classList.remove('dragover'));
        });

        // Drop handler
        uploadBox.addEventListener('drop', function(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                fileInput.files = files;
                showFileName(files[0].name);
            }
        });

        // Click to upload
        uploadBox.addEventListener('click', () => fileInput.click());

        // File selection handler
        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                showFileName(this.files[0].name);
            }
        });

        function showFileName(name) {
            fileName.style.display = 'block';
            fileName.innerHTML = `<i class="fas fa-check-circle"></i> ${name}`;
        }

        // ===== UPLOAD TO FIRESTORE =====
        uploadBtn.addEventListener('click', async function() {
            if (!fileInput.files.length) {
                alert('Please select an Excel file');
                return;
            }

            // Disable button
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                const file = fileInput.files[0];
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data);
                const firstSheet = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheet];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                uploadBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Uploading ${jsonData.length} records...`;

                let newCount = 0;
                let duplicateCount = 0;
                let errorCount = 0;

                // Process each row
                for (const row of jsonData) {
                    try {
                        const cartCode = row['Cart confirmation code'];
                        if (!cartCode) continue;

                        // Check for duplicate
                        const existing = await db.collection('sales_transactions')
                            .where('cart_confirmation_code', '==', cartCode)
                            .get();

                        if (!existing.empty) {
                            duplicateCount++;
                            continue;
                        }

                        // Extract agent name
                        let agentName = row['Booking Agent'] || row['Affiliate'] || '';

                        // Determine channel
                        let channel = 'Unknown';
                        const bookingChannel = row['Booking channel'] || '';
                        
                        if (bookingChannel.includes('GetYourGuide')) channel = 'OTA_GetYourGuide';
                        else if (bookingChannel.includes('Viator')) channel = 'OTA_Viator';
                        else if (bookingChannel.includes('toristy')) channel = 'OTA_Toristy';
                        else if (bookingChannel === 'Backend') channel = 'Agent';
                        else if (bookingChannel === 'wegodaily - Website' || bookingChannel === 'Default Channel') channel = 'Direct';
                        else if (bookingChannel === 'Tourbin' && !agentName) channel = 'TourBin_Direct';
                        else if (bookingChannel === 'Tourbin' && agentName) channel = 'Agent';

                        // Parse creation date
                        let creationDate = null;
                        if (row['Creation date']) {
                            creationDate = new Date(row['Creation date']);
                        }

                        // Parse participants
                        let totalPax = 1;
                        if (row['Total PAX']) totalPax = parseInt(row['Total PAX']) || 1;
                        else if (row['Participants']) {
                            const paxMatch = String(row['Participants']).match(/(\d+)/);
                            totalPax = paxMatch ? parseInt(paxMatch[0]) : 1;
                        }

                        // Add to Firestore
                        await db.collection('sales_transactions').add({
                            cart_confirmation_code: cartCode,
                            product_confirmation_code: row['Product confirmation code'] || '',
                            creation_date: creationDate ? firebase.firestore.Timestamp.fromDate(creationDate) : null,
                            status: row['Status'] || 'UNKNOWN',
                            total_price_usd: parseFloat(row['Total price with discount']) || 0,
                            commission_usd: parseFloat(row['Commission']) || 0,
                            agent_name: agentName,
                            channel: channel,
                            total_pax: totalPax,
                            product_title: row['Product title'] || '',
                            supplier_net_price: parseFloat(row['Supplier NET price']) || 0,
                            supplier_currency: row['Supplier currency'] || 'USD',
                            report_date: document.getElementById('reportDate').value,
                            report_type: document.getElementById('reportTag').value,
                            file_name: file.name,
                            uploaded_at: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        newCount++;

                    } catch (rowError) {
                        console.error('Row processing error:', rowError);
                        errorCount++;
                    }
                }

                // ===== SHOW SUCCESS MESSAGE =====
                document.getElementById('successTitle').innerHTML = 'Upload completed';
                document.getElementById('successDesc').innerHTML = `File: ${file.name}`;
                
                let statsHtml = `
                    <div class="stat-item">
                        <span class="stat-label">Total</span>
                        <span class="stat-value">${jsonData.length}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">New</span>
                        <span class="stat-value">${newCount}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Duplicate</span>
                        <span class="stat-value">${duplicateCount}</span>
                    </div>
                `;
                
                if (errorCount > 0) {
                    statsHtml += `
                        <div class="stat-item">
                            <span class="stat-label">Errors</span>
                            <span class="stat-value" style="color: var(--tb-error);">${errorCount}</span>
                        </div>
                    `;
                }
                
                document.getElementById('successStats').innerHTML = statsHtml;
                successMsg.style.display = 'flex';

                // Auto-hide after 10 seconds
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 10000);

            } catch (error) {
                console.error('Upload failed:', error);
                alert('Upload failed: ' + error.message);
            } finally {
                // Re-enable button
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload to database';
            }
        });
    </script>
</body>
</html>
