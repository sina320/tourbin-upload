<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORBIN · Upload</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #F5F7FA; padding: 28px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 680px; width: 100%; margin: 0 auto; }
        
        :root {
            --torbin-primary: #0A5C4E;
            --torbin-primary-light: #E2F0EE;
            --torbin-success: #0A7C71;
            --torbin-success-light: #E6F7ED;
            --torbin-gray-100: #F8FAFC;
            --torbin-gray-200: #F1F5F9;
            --torbin-gray-300: #E2E8F0;
            --torbin-gray-400: #CBD5E1;
            --torbin-gray-500: #94A3B8;
            --torbin-gray-600: #64748B;
            --torbin-gray-700: #475569;
            --torbin-gray-800: #1E293B;
            --torbin-gray-900: #0F172A;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .logo { display: flex; align-items: center; gap: 12px; }
        .logo span { font-size: 22px; font-weight: 600; color: var(--torbin-gray-900); letter-spacing: -0.3px; }
        .user-badge { display: flex; align-items: center; gap: 12px; background: white; padding: 6px 20px 6px 12px; border-radius: 40px; border: 1px solid var(--torbin-gray-300); cursor: pointer; }
        .user-avatar { width: 34px; height: 34px; background: var(--torbin-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 500; }

        .upload-card { background: white; border-radius: 28px; padding: 40px; border: 1px solid var(--torbin-gray-200); margin-bottom: 24px; }
        .section-title { font-size: 18px; font-weight: 600; color: var(--torbin-gray-900); margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--torbin-primary); }

        .upload-area {
            border: 2px dashed var(--torbin-gray-300);
            background: var(--torbin-gray-100);
            border-radius: 20px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 24px;
        }
        .upload-area:hover { border-color: var(--torbin-primary); background: var(--torbin-primary-light); }
        .upload-area.dragover { border-color: var(--torbin-primary); background: var(--torbin-primary-light); border-width: 2px; }
        .upload-icon { font-size: 48px; color: var(--torbin-gray-500); margin-bottom: 16px; }
        .upload-text { font-size: 16px; font-weight: 500; color: var(--torbin-gray-800); margin-bottom: 8px; }
        .upload-hint { color: var(--torbin-gray-600); font-size: 14px; }
        .file-name { margin-top: 16px; padding: 12px; background: var(--torbin-gray-100); border-radius: 12px; font-size: 14px; color: var(--torbin-primary); font-weight: 500; display: none; }

        .row { display: flex; gap: 16px; margin-bottom: 24px; }
        .field { flex: 1; }
        .field-label { font-size: 12px; color: var(--torbin-gray-600); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .field-label i { color: var(--torbin-primary); }
        .date-input, .tag-select { width: 100%; padding: 14px 16px; border: 1px solid var(--torbin-gray-300); border-radius: 16px; font-size: 15px; background: white; }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--torbin-primary);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn:hover { background: #0A4A3E; }
        .btn:disabled { background: var(--torbin-gray-400); cursor: not-allowed; }

        /* ===== SUCCESS MESSAGE ===== */
        .success-message {
            background: var(--torbin-success-light);
            border: 1px solid var(--torbin-success);
            border-radius: 20px;
            padding: 24px;
            margin-top: 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            animation: slideIn 0.3s ease;
        }
        .success-icon {
            width: 56px;
            height: 56px;
            background: var(--torbin-success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
        }
        .success-content { flex: 1; }
        .success-title { font-size: 18px; font-weight: 600; color: var(--torbin-success); margin-bottom: 8px; }
        .success-stats { display: flex; gap: 24px; margin-top: 12px; }
        .stat-item { display: flex; align-items: baseline; gap: 8px; }
        .stat-label { font-size: 13px; color: var(--torbin-gray-600); }
        .stat-value { font-size: 18px; font-weight: 600; color: var(--torbin-gray-900); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--torbin-gray-600); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <span>TORBIN</span>
            </div>
            <div class="user-badge" id="userBadge" onclick="showLoginModal()">
                <div class="user-avatar" id="userAvatar">SM</div>
                <div style="font-weight: 500; color: var(--torbin-gray-900);" id="userName">Sign in</div>
            </div>
        </div>

        <!-- Upload Card -->
        <div class="upload-card">
            <div class="section-title">
                <i class="fas fa-cloud-upload-alt"></i> Upload sales report
            </div>

            <!-- Drag & Drop Area -->
            <div class="upload-area" id="uploadBox">
                <div class="upload-icon"><i class="fas fa-file-excel"></i></div>
                <div class="upload-text">Choose Excel file or drag it here</div>
                <div class="upload-hint">.xlsx only</div>
                <div class="file-name" id="fileName"></div>
            </div>
            <input type="file" id="fileInput" accept=".xlsx" style="display: none;">

            <!-- Date & Type -->
            <div class="row">
                <div class="field">
                    <div class="field-label"><i class="far fa-calendar-alt"></i> Report date</div>
                    <input type="date" class="date-input" id="reportDate">
                </div>
                <div class="field">
                    <div class="field-label"><i class="fas fa-tag"></i> Type</div>
                    <select class="tag-select" id="reportTag">
                        <option value="daily">Daily</option>
                        <option value="monthly">Monthly</option>
                        <option value="correction">Correction</option>
                    </select>
                </div>
            </div>

            <!-- Upload Button -->
            <button class="btn" id="uploadBtn">
                <i class="fas fa-cloud-upload-alt"></i>
                Upload to Firestore
            </button>

            <!-- ===== SUCCESS MESSAGE ===== -->
            <div id="successMessage" class="success-message hidden">
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <div class="success-content">
                    <div class="success-title" id="successTitle">Upload successful!</div>
                    <div id="successDetails">File processed and added to database</div>
                    <div class="success-stats" id="successStats"></div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <i class="fas fa-database"></i> TORBIN · Data Ingestion · v2.0
        </div>
    </div>

    <!-- ===== LOGIN MODAL ===== -->
    <div id="loginModal" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 1000;">
        <div style="background: white; padding: 40px; border-radius: 32px; width: 380px; max-width: 90%;">
            <div style="font-size: 24px; font-weight: 600; color: #0F172A; margin-bottom: 8px;">Welcome back</div>
            <div style="color: #64748B; font-size: 14px; margin-bottom: 32px;">Sign in to TORBIN Upload</div>
            <button class="login-btn" onclick="loginAs('Sales Manager', 'SM')" style="width: 100%; padding: 14px; background: white; border: 1px solid #E2E8F0; border-radius: 60px; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; cursor: pointer;">
                <i class="fas fa-user-tie" style="color: #0A5C4E;"></i> Sales Manager
            </button>
            <button class="login-btn" onclick="loginAs('Finance', 'FN')" style="width: 100%; padding: 14px; background: white; border: 1px solid #E2E8F0; border-radius: 60px; display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; cursor: pointer;">
                <i class="fas fa-calculator" style="color: #0A5C4E;"></i> Finance
            </button>
            <button class="logout-btn" id="logoutBtn" onclick="logout()" style="width: 100%; padding: 12px; background: #FEF2F2; border: none; border-radius: 60px; color: #DC2626; margin-top: 20px; display: none; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
                <i class="fas fa-sign-out-alt"></i> Sign out
            </button>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyDGomc7oZCGf8QkQq3I_SJht7GJF6pz_5c",
            authDomain: "tourbin-sales-dashboard-v2.firebaseapp.com",
            projectId: "tourbin-sales-dashboard-v2",
            storageBucket: "tourbin-sales-dashboard-v2.firebasestorage.app",
            messagingSenderId: "827092290582",
            appId: "1:827092290582:web:24e530b12858c615d13937"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);

        // ===== STATE =====
        let currentUser = null;

        // ===== AUTH =====
        window.showLoginModal = function() {
            document.getElementById('loginModal').style.display = 'flex';
        };

        window.hideLoginModal = function() {
            document.getElementById('loginModal').style.display = 'none';
        };

        window.loginAs = function(role, avatar) {
            currentUser = { name: role, avatar: avatar };
            document.getElementById('userName').innerHTML = role;
            document.getElementById('userAvatar').innerHTML = avatar;
            document.getElementById('logoutBtn').style.display = 'flex';
            hideLoginModal();
        };

        window.logout = function() {
            currentUser = null;
            document.getElementById('userName').innerHTML = 'Sign in';
            document.getElementById('userAvatar').innerHTML = 'SM';
            document.getElementById('logoutBtn').style.display = 'none';
        };

        // ===== DATE =====
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        document.getElementById('reportDate').value = `${y}-${m}-${d}`;

        // ===== DRAG & DROP =====
        const fileInput = document.getElementById('fileInput');
        const uploadBox = document.getElementById('uploadBox');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const successMsg = document.getElementById('successMessage');

        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadBox.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadBox.addEventListener(eventName, () => uploadBox.classList.add('dragover'));
        });
        ['dragleave', 'drop'].forEach(eventName => {
            uploadBox.addEventListener(eventName, () => uploadBox.classList.remove('dragover'));
        });

        // Drop handler
        uploadBox.addEventListener('drop', function(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                fileInput.files = files;
                showFileName(files[0].name);
            }
        });

        // Click to upload
        uploadBox.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) showFileName(this.files[0].name);
        });

        function showFileName(name) {
            fileName.style.display = 'block';
            fileName.innerHTML = `<i class="fas fa-check-circle" style="color: var(--torbin-success);"></i> ${name}`;
        }

        // ===== UPLOAD =====
        uploadBtn.addEventListener('click', async function() {
            if (!currentUser) {
                alert('Please sign in first');
                showLoginModal();
                return;
            }

            if (!fileInput.files.length) {
                alert('Please select a file');
                return;
            }

            // Disable button
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                const file = fileInput.files[0];
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data);
                const firstSheet = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheet];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);

                uploadBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Uploading ${jsonData.length} records...`;

                let newCount = 0, duplicateCount = 0, errorCount = 0;

                // Process each row
                for (const row of jsonData) {
                    try {
                        const cartCode = row['Cart confirmation code'];
                        if (!cartCode) continue;

                        // Check duplicate
                        const existing = await db.collection('sales_transactions')
                            .where('cart_confirmation_code', '==', cartCode)
                            .get();

                        if (!existing.empty) {
                            duplicateCount++;
                            continue;
                        }

                        // Extract agent
                        let agentName = row['Booking Agent'] || row['Affiliate'] || '';

                        // Determine channel
                        let channel = 'Unknown';
                        const bookingChannel = row['Booking channel'] || '';
                        if (bookingChannel.includes('GetYourGuide')) channel = 'OTA_GetYourGuide';
                        else if (bookingChannel.includes('Viator')) channel = 'OTA_Viator';
                        else if (bookingChannel.includes('toristy')) channel = 'OTA_Toristy';
                        else if (bookingChannel === 'Backend') channel = 'Agent';
                        else if (bookingChannel === 'wegodaily - Website' || bookingChannel === 'Default Channel') channel = 'Direct';
                        else if (bookingChannel === 'Tourbin' && !agentName) channel = 'Tourbin_Direct';
                        else if (bookingChannel === 'Tourbin' && agentName) channel = 'Agent';

                        // Parse dates
                        let creationDate = null;
                        if (row['Creation date']) creationDate = new Date(row['Creation date']);

                        // Participants
                        let totalPax = 1;
                        if (row['Total PAX']) totalPax = parseInt(row['Total PAX']) || 1;
                        else if (row['Participants']) {
                            const match = String(row['Participants']).match(/(\d+)/);
                            totalPax = match ? parseInt(match[0]) : 1;
                        }

                        // Add to Firestore
                        await db.collection('sales_transactions').add({
                            cart_confirmation_code: cartCode,
                            product_confirmation_code: row['Product confirmation code'] || '',
                            creation_date: creationDate ? firebase.firestore.Timestamp.fromDate(creationDate) : null,
                            status: row['Status'] || 'UNKNOWN',
                            total_price_usd: parseFloat(row['Total price with discount']) || 0,
                            commission_usd: parseFloat(row['Commission']) || 0,
                            agent_name: agentName,
                            channel: channel,
                            total_pax: totalPax,
                            product_title: row['Product title'] || '',
                            supplier_net_price: parseFloat(row['Supplier NET price']) || 0,
                            supplier_currency: row['Supplier currency'] || 'USD',
                            report_date: document.getElementById('reportDate').value,
                            report_type: document.getElementById('reportTag').value,
                            file_name: file.name,
                            uploaded_at: firebase.firestore.FieldValue.serverTimestamp(),
                            uploaded_by: currentUser?.name || 'unknown'
                        });

                        newCount++;
                    } catch (error) {
                        console.error('Row error:', error);
                        errorCount++;
                    }
                }

                // ===== SHOW SUCCESS MESSAGE =====
                document.getElementById('successTitle').innerHTML = '✅ Upload successful!';
                document.getElementById('successDetails').innerHTML = `File: ${file.name}`;
                document.getElementById('successStats').innerHTML = `
                    <div class="stat-item"><span class="stat-label">Records:</span><span class="stat-value">${jsonData.length}</span></div>
                    <div class="stat-item"><span class="stat-label">New:</span><span class="stat-value">${newCount}</span></div>
                    <div class="stat-item"><span class="stat-label">Duplicate:</span><span class="stat-value">${duplicateCount}</span></div>
                    ${errorCount ? `<div class="stat-item"><span class="stat-label">Errors:</span><span class="stat-value" style="color: #DC2626;">${errorCount}</span></div>` : ''}
                `;
                successMsg.classList.remove('hidden');

                // Auto-hide after 10 seconds
                setTimeout(() => successMsg.classList.add('hidden'), 10000);

            } catch (error) {
                console.error('Upload failed:', error);
                alert('Upload failed: ' + error.message);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload to Firestore';
            }
        });

        // Close modal on outside click
        window.onclick = function(e) {
            const modal = document.getElementById('loginModal');
            if (e.target === modal) hideLoginModal();
        };
    </script>
</body>
</html>
