<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORBIN · Data Ingestion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 560px; width: 100%; background: white; border-radius: 28px; box-shadow: 0 8px 30px rgba(0,0,0,0.03); padding: 32px; }
        h1 { font-size: 22px; font-weight: 500; color: #0a2c3d; margin-bottom: 4px; letter-spacing: -0.3px; }
        .sub { color: #5b6f7c; font-size: 13px; margin-bottom: 32px; font-weight: 400; }
        .upload-area { border: 1.5px dashed #d0d9e0; background: #fafcfc; border-radius: 20px; padding: 36px 20px; text-align: center; cursor: pointer; transition: all 0.15s; margin-bottom: 24px; }
        .upload-area:hover { border-color: #0a7c71; background: #f3f9f8; }
        .upload-icon { font-size: 28px; margin-bottom: 12px; color: #3e5a63; }
        .upload-text { font-size: 15px; font-weight: 500; color: #1a2e36; }
        .upload-hint { color: #6f828c; font-size: 13px; margin-top: 8px; }
        .file-name { font-size: 13px; color: #0a7c71; margin-top: 12px; font-weight: 500; }
        input[type=file] { display: none; }
        .row { display: flex; gap: 12px; margin-bottom: 24px; align-items: flex-end; }
        .field { flex: 1; }
        .field-label { font-size: 12px; color: #4f646f; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
        .date-input, .tag-select { width: 100%; padding: 12px 14px; border: 1px solid #e0e8ed; border-radius: 14px; font-size: 14px; background: white; }
        .tag-select { background: white; color: #1a2e36; }
        .btn { width: 100%; background: #0a7c71; color: white; border: none; padding: 14px; border-radius: 40px; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.1s; border: 1px solid #0a7c71; }
        .btn:hover { background: #0e665c; }
        .btn:disabled { background: #b6cdca; border-color: #b6cdca; cursor: not-allowed; }
        .summary { margin-top: 28px; padding: 20px; background: #f7fafc; border-radius: 18px; border: 1px solid #eaf0f4; display: none; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .summary-label { color: #4f646f; }
        .summary-value { font-weight: 500; color: #0a2c3d; }
        .badge { background: #e2f0ee; color: #0a7c71; padding: 4px 10px; border-radius: 50px; font-size: 12px; display: inline-block; }
        .footer { margin-top: 28px; color: #8c9ca5; font-size: 11px; text-align: center; border-top: 1px solid #ecf1f5; padding-top: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TORBIN</h1>
        <div class="sub">Data ingestion · Firestore</div>

        <!-- Upload -->
        <div class="upload-area" id="uploadBox">
            <div class="upload-icon">📂</div>
            <div class="upload-text">Choose Excel file</div>
            <div class="upload-hint">.xlsx only</div>
            <div class="file-name" id="fileName"></div>
        </div>
        <input type="file" id="fileInput" accept=".xlsx">

        <!-- Date + Tag -->
        <div class="row">
            <div class="field">
                <div class="field-label">📆 Date</div>
                <input type="date" class="date-input" id="reportDate">
            </div>
            <div class="field">
                <div class="field-label">🏷️ Type</div>
                <select class="tag-select" id="reportTag">
                    <option value="daily">Daily</option>
                    <option value="monthly">Monthly</option>
                    <option value="correction">Correction</option>
                </select>
            </div>
        </div>

        <!-- Upload button -->
        <button class="btn" id="uploadBtn">Upload to Firestore</button>

        <!-- Summary (shown after upload) -->
        <div class="summary" id="uploadSummary">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <span style="font-weight: 600; color: #0a2c3d;">Summary</span>
                <span class="badge">Appended</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">File</span>
                <span class="summary-value" id="summaryFile">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Report date</span>
                <span class="summary-value" id="summaryDate">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Records</span>
                <span class="summary-value" id="summaryRecords">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">New / Duplicate</span>
                <span class="summary-value" id="summaryNewDup">—</span>
            </div>
        </div>

        <div class="footer">
            TORBIN · Auto-backup daily 23:00 · Version 1.0
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBox = document.getElementById('uploadBox');
        const fileName = document.getElementById('fileName');
        const uploadBtn = document.getElementById('uploadBtn');
        const reportDate = document.getElementById('reportDate');
        const reportTag = document.getElementById('reportTag');
        const summary = document.getElementById('uploadSummary');

        // Set today as default date
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        reportDate.value = `${y}-${m}-${d}`;

        // Trigger file input
        uploadBox.addEventListener('click', () => fileInput.click());

        // Show selected file name
        fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                fileName.textContent = this.files[0].name;
            } else {
                fileName.textContent = '';
            }
        });

        // Mock upload
        uploadBtn.addEventListener('click', async function() {
            if (!fileInput.files.length) {
                alert('Please select a file');
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading...';

            await new Promise(resolve => setTimeout(resolve, 1600));

            // Fill summary
            const file = fileInput.files[0];
            const recordCount = Math.floor(Math.random() * 60) + 25;
            const newRecords = Math.floor(recordCount * 0.92);
            const dup = recordCount - newRecords;

            document.getElementById('summaryFile').textContent = file.name;
            document.getElementById('summaryDate').textContent = reportDate.value;
            document.getElementById('summaryRecords').textContent = recordCount;
            document.getElementById('summaryNewDup').textContent = `${newRecords} / ${dup}`;

            summary.style.display = 'block';

            uploadBtn.disabled = false;
            uploadBtn.textContent = 'Upload to Firestore';
        });
    </script>
</body>
</html>
