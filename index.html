<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORBIN · Data Ingestion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 560px; width: 100%; background: white; border-radius: 28px; box-shadow: 0 8px 30px rgba(0,0,0,0.03); padding: 32px; }
        h1 { font-size: 22px; font-weight: 500; color: #0a2c3d; margin-bottom: 4px; letter-spacing: -0.3px; }
        .sub { color: #5b6f7c; font-size: 13px; margin-bottom: 32px; font-weight: 400; }
        .upload-area { border: 1.5px dashed #d0d9e0; background: #fafcfc; border-radius: 20px; padding: 36px 20px; text-align: center; cursor: pointer; transition: all 0.15s; margin-bottom: 24px; }
        .upload-area:hover { border-color: #0a7c71; background: #f3f9f8; }
        .upload-icon { font-size: 28px; margin-bottom: 12px; color: #3e5a63; }
        .upload-text { font-size: 15px; font-weight: 500; color: #1a2e36; }
        .upload-hint { color: #6f828c; font-size: 13px; margin-top: 8px; }
        .file-name { font-size: 13px; color: #0a7c71; margin-top: 12px; font-weight: 500; }
        input[type=file] { display: none; }
        .row { display: flex; gap: 12px; margin-bottom: 24px; align-items: flex-end; }
        .field { flex: 1; }
        .field-label { font-size: 12px; color: #4f646f; margin-bottom: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
        .date-input, .tag-select { width: 100%; padding: 12px 14px; border: 1px solid #e0e8ed; border-radius: 14px; font-size: 14px; background: white; }
        .tag-select { background: white; color: #1a2e36; }
        .btn { width: 100%; background: #0a7c71; color: white; border: none; padding: 14px; border-radius: 40px; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.1s; border: 1px solid #0a7c71; }
        .btn:hover { background: #0e665c; }
        .btn:disabled { background: #b6cdca; border-color: #b6cdca; cursor: not-allowed; }
        .summary { margin-top: 28px; padding: 20px; background: #f7fafc; border-radius: 18px; border: 1px solid #eaf0f4; display: none; }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .summary-label { color: #4f646f; }
        .summary-value { font-weight: 500; color: #0a2c3d; }
        .badge { background: #e2f0ee; color: #0a7c71; padding: 4px 10px; border-radius: 50px; font-size: 12px; display: inline-block; }
        .footer { margin-top: 28px; color: #8c9ca5; font-size: 11px; text-align: center; border-top: 1px solid #ecf1f5; padding-top: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TORBIN</h1>
        <div class="sub">Data ingestion · Firestore</div>

        <!-- Upload Area -->
        <div class="upload-area" id="uploadBox">
            <div class="upload-icon">📂</div>
            <div class="upload-text">Choose Excel file</div>
            <div class="upload-hint">.xlsx only</div>
            <div class="file-name" id="fileName"></div>
        </div>
        <input type="file" id="fileInput" accept=".xlsx">

        <!-- Date + Tag -->
        <div class="row">
            <div class="field">
                <div class="field-label">📆 Date</div>
                <input type="date" class="date-input" id="reportDate">
            </div>
            <div class="field">
                <div class="field-label">🏷️ Type</div>
                <select class="tag-select" id="reportTag">
                    <option value="daily">Daily</option>
                    <option value="monthly">Monthly</option>
                    <option value="correction">Correction</option>
                </select>
            </div>
        </div>

        <!-- Upload Button -->
        <button class="btn" id="uploadBtn">Upload to Firestore</button>

        <!-- Summary (shown after upload) -->
        <div class="summary" id="uploadSummary">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <span style="font-weight: 600; color: #0a2c3d;">Summary</span>
                <span class="badge">Appended</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">File</span>
                <span class="summary-value" id="summaryFile">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Report date</span>
                <span class="summary-value" id="summaryDate">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Records</span>
                <span class="summary-value" id="summaryRecords">—</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">New / Duplicate</span>
                <span class="summary-value" id="summaryNewDup">—</span>
            </div>
        </div>

        <div class="footer">
            TORBIN · Auto-backup daily 23:00 · Version 1.0
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- SheetJS - Excel Parser -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

    <script>
        // ============================================
        // TORBIN - Data Ingestion Gateway
        // Firebase Configuration & Firestore Upload
        // ============================================

        // ---------- 1. Firebase Configuration ----------
        const firebaseConfig = {
            apiKey: "AIzaSyDGomc7oZCGf8QkQq3I_SJht7GJF6pz_5c",
            authDomain: "tourbin-sales-dashboard-v2.firebaseapp.com",
            projectId: "tourbin-sales-dashboard-v2",
            storageBucket: "tourbin-sales-dashboard-v2.firebasestorage.app",
            messagingSenderId: "827092290582",
            appId: "1:827092290582:web:24e530b12858c615d13937"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);

        // ---------- 2. DOM Elements ----------
        const elements = {
            fileInput: document.getElementById('fileInput'),
            uploadBox: document.getElementById('uploadBox'),
            fileName: document.getElementById('fileName'),
            uploadBtn: document.getElementById('uploadBtn'),
            reportDate: document.getElementById('reportDate'),
            reportTag: document.getElementById('reportTag'),
            summary: document.getElementById('uploadSummary'),
            summaryFile: document.getElementById('summaryFile'),
            summaryDate: document.getElementById('summaryDate'),
            summaryRecords: document.getElementById('summaryRecords'),
            summaryNewDup: document.getElementById('summaryNewDup')
        };

        // ---------- 3. Set Default Date (Today) ----------
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        elements.reportDate.value = `${y}-${m}-${d}`;

        // ---------- 4. File Upload Handlers ----------
        // Click on upload box triggers file input
        elements.uploadBox.addEventListener('click', () => elements.fileInput.click());

        // Show selected file name
        elements.fileInput.addEventListener('change', function() {
            if (this.files.length > 0) {
                elements.fileName.textContent = this.files[0].name;
            } else {
                elements.fileName.textContent = '';
            }
        });

        // ---------- 5. Main Upload Function ----------
        elements.uploadBtn.addEventListener('click', async function() {
            // Validate file selection
            if (!elements.fileInput.files.length) {
                alert('Please select a file');
                return;
            }

            // Disable button during upload
            elements.uploadBtn.disabled = true;
            elements.uploadBtn.textContent = 'Reading file...';

            try {
                // Read Excel file
                const file = elements.fileInput.files[0];
                const data = await file.arrayBuffer();
                const workbook = XLSX.read(data);
                const firstSheet = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheet];
                
                // Convert to JSON
                const jsonData = XLSX.utils.sheet_to_json(worksheet);
                
                elements.uploadBtn.textContent = `Uploading ${jsonData.length} records...`;
                
                // Statistics
                let newCount = 0;
                let duplicateCount = 0;
                let errorCount = 0;

                // Process each row
                for (const row of jsonData) {
                    try {
                        // Check for duplicate using Cart confirmation code
                        const cartCode = row['Cart confirmation code'];
                        if (!cartCode) continue;

                        const existing = await db.collection('sales_transactions')
                            .where('cart_confirmation_code', '==', cartCode)
                            .get();

                        if (!existing.empty) {
                            duplicateCount++;
                            continue;
                        }

                        // Extract agent name (Booking Agent or Affiliate)
                        let agentName = '';
                        if (row['Booking Agent'] && row['Booking Agent'] !== '') {
                            agentName = row['Booking Agent'];
                        } else if (row['Affiliate'] && row['Affiliate'] !== '') {
                            agentName = row['Affiliate'];
                        }

                        // Determine sales channel
                        let channel = 'Unknown';
                        const bookingChannel = row['Booking channel'] || '';
                        
                        if (bookingChannel.includes('GetYourGuide')) channel = 'OTA_GetYourGuide';
                        else if (bookingChannel.includes('Viator')) channel = 'OTA_Viator';
                        else if (bookingChannel.includes('toristy')) channel = 'OTA_Toristy';
                        else if (bookingChannel === 'Backend') channel = 'Agent';
                        else if (bookingChannel === 'wegodaily - Website' || bookingChannel === 'Default Channel') channel = 'Direct';
                        else if (bookingChannel === 'Tourbin' && !agentName) channel = 'Tourbin_Direct';
                        else if (bookingChannel === 'Tourbin' && agentName) channel = 'Agent';
                        else channel = bookingChannel || 'Unknown';

                        // Parse creation date
                        let creationDate = null;
                        if (row['Creation date']) {
                            creationDate = new Date(row['Creation date']);
                        }

                        // Parse total participants
                        let totalPax = 1;
                        if (row['Total PAX']) {
                            totalPax = parseInt(row['Total PAX']) || 1;
                        } else if (row['Participants']) {
                            const paxMatch = String(row['Participants']).match(/(\d+)/);
                            totalPax = paxMatch ? parseInt(paxMatch[0]) : 1;
                        }

                        // Parse price and commission (USD)
                        let priceUSD = 0;
                        if (row['Total price with discount']) {
                            priceUSD = parseFloat(row['Total price with discount']) || 0;
                        }

                        let commissionUSD = 0;
                        if (row['Commission']) {
                            commissionUSD = parseFloat(row['Commission']) || 0;
                        }

                        // Add document to Firestore
                        await db.collection('sales_transactions').add({
                            cart_confirmation_code: cartCode,
                            product_confirmation_code: row['Product confirmation code'] || '',
                            creation_date: creationDate ? firebase.firestore.Timestamp.fromDate(creationDate) : null,
                            status: row['Status'] || 'UNKNOWN',
                            total_price_usd: priceUSD,
                            commission_usd: commissionUSD,
                            agent_name: agentName,
                            channel: channel,
                            total_pax: totalPax,
                            product_title: row['Product title'] || '',
                            supplier_net_price: parseFloat(row['Supplier NET price']) || 0,
                            supplier_currency: row['Supplier currency'] || 'USD',
                            report_date: elements.reportDate.value,
                            report_type: elements.reportTag.value,
                            file_name: file.name,
                            uploaded_at: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        newCount++;

                    } catch (error) {
                        console.error('Error processing row:', error);
                        errorCount++;
                    }
                }

                // ---------- 6. Display Summary ----------
                elements.summaryFile.textContent = file.name;
                elements.summaryDate.textContent = elements.reportDate.value;
                elements.summaryRecords.textContent = jsonData.length;
                elements.summaryNewDup.textContent = `${newCount} / ${duplicateCount}`;
                
                if (errorCount > 0) {
                    elements.summaryNewDup.textContent += ` (${errorCount} errors)`;
                }

                elements.summary.style.display = 'block';

            } catch (error) {
                console.error('Upload failed:', error);
                alert('Upload failed: ' + error.message);
            }

            // Re-enable button
            elements.uploadBtn.disabled = false;
            elements.uploadBtn.textContent = 'Upload to Firestore';
        });
    </script>
</body>
</html>
